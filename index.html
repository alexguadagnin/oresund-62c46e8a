<!DOCTYPE html>
<meta charset="utf-8">
<title>Sei Giorni sull'Øresund</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#0F5C6B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Øresund">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
:root{
  --ground:#EDEFEE; --surface:#FFFFFF; --surface-2:#E4E8E7; --line:#D2D8D7;
  --ink:#111A1E; --ink-2:#42545A; --ink-3:#6E8087;
  --accent:#0F5C6B; --accent-soft:#DCEAEC; --brick:#C2712C; --brick-soft:#F6E7D6;
  --ok:#2E7D53; --ok-soft:#DCEDE3; --warn:#9A6B12; --warn-soft:#F6ECD5; --risk:#A93A2B; --risk-soft:#F7E0DC;
  --shadow:0 1px 2px rgba(17,26,30,.06),0 6px 18px rgba(17,26,30,.06);
  --f-disp:'Familjen Grotesk',ui-sans-serif,system-ui,sans-serif;
  --f-body:'Public Sans',ui-sans-serif,system-ui,-apple-system,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --tab-h:62px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0E1416; --surface:#161E21; --surface-2:#1E282C; --line:#2C383D;
    --ink:#E7EDEC; --ink-2:#A8B8BC; --ink-3:#7C8F95;
    --accent:#5FB3BF; --accent-soft:#173136; --brick:#E0A268; --brick-soft:#33241726;
    --ok:#68C08D; --ok-soft:#15291F; --warn:#D9AE55; --warn-soft:#2A2314; --risk:#E38878; --risk-soft:#2E1A17;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --ground:#0E1416; --surface:#161E21; --surface-2:#1E282C; --line:#2C383D;
  --ink:#E7EDEC; --ink-2:#A8B8BC; --ink-3:#7C8F95;
  --accent:#5FB3BF; --accent-soft:#173136; --brick:#E0A268; --brick-soft:#332417;
  --ok:#68C08D; --ok-soft:#15291F; --warn:#D9AE55; --warn-soft:#2A2314; --risk:#E38878; --risk-soft:#2E1A17;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);
}

*{box-sizing:border-box}
/* L'attributo hidden deve battere i display:flex/grid dichiarati sotto. */
[hidden]{display:none !important}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--f-body); font-size:16px; line-height:1.55;
  -webkit-text-size-adjust:100%; padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px));
}
.wrap{max-width:600px; margin:0 auto; padding:0 14px}
h1,h2,h3,h4{font-family:var(--f-disp); margin:0; text-wrap:balance; letter-spacing:-.015em}
a{color:var(--accent)}
button{font:inherit; color:inherit}

/* ---------- top bar ---------- */
.top{position:sticky; top:0; z-index:40; background:var(--ground); border-bottom:1px solid var(--line)}
.top-in{max-width:600px; margin:0 auto; padding:10px 14px 9px; display:flex; align-items:baseline; gap:10px}
.brand{font-family:var(--f-disp); font-weight:700; font-size:1.02rem; letter-spacing:-.02em}
.brand span{color:var(--accent)}
.clock{margin-left:auto; font-family:var(--f-mono); font-size:.8rem; color:var(--ink-3); font-variant-numeric:tabular-nums}
.askbtn{
  display:inline-flex; align-items:center; gap:5px; text-decoration:none;
  font-family:var(--f-mono); font-size:.68rem; color:var(--accent);
  border:1px solid var(--accent); border-radius:999px; padding:3px 10px; white-space:nowrap;
}
.askbtn:hover{background:var(--accent); color:#fff}
.askbtn svg{width:13px; height:13px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}

/* ---------- tabs ---------- */
.tabs{
  position:fixed; left:0; right:0; bottom:0; z-index:50;
  background:var(--surface); border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.tabs-in{max-width:600px; margin:0 auto; display:grid; grid-template-columns:repeat(6,1fr)}
.tab{
  appearance:none; background:none; border:0; cursor:pointer;
  height:var(--tab-h); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  font-size:.62rem; font-weight:600; letter-spacing:.01em; text-transform:uppercase; color:var(--ink-3);
  white-space:nowrap; min-width:0;
  border-top:2px solid transparent; margin-top:-1px;
}
.tab svg{width:21px; height:21px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--accent); border-top-color:var(--accent)}
.tab:focus-visible{outline:2px solid var(--accent); outline-offset:-3px}
@media (max-width:359px){ .tab{font-size:.54rem; letter-spacing:0} .tab svg{width:19px; height:19px} }

/* ---------- generic ---------- */
.panel{display:none; padding-top:16px}
.panel.on{display:block}
.eyebrow{
  font-family:var(--f-mono); font-size:.68rem; text-transform:uppercase; letter-spacing:.12em;
  color:var(--ink-3); margin:0 0 6px
}
.sec-h{font-size:1.35rem; font-weight:700; line-height:1.2; margin:0 0 4px}
.lede{color:var(--ink-2); font-size:.94rem; margin:0 0 16px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px; box-shadow:var(--shadow)}
.card + .card{margin-top:10px}
.stack{display:flex; flex-direction:column; gap:10px}
hr.rule{border:0; border-top:1px solid var(--line); margin:22px 0}

/* ---------- badges ---------- */
.b{
  display:inline-flex; align-items:center; gap:5px; border-radius:999px;
  padding:2px 8px; font-family:var(--f-mono); font-size:.66rem; font-weight:500;
  letter-spacing:.02em; white-space:normal; vertical-align:middle; max-width:100%;
}
.b::before{content:""; width:6px; height:6px; border-radius:50%; background:currentColor; flex:none}
.b.ok{background:var(--ok-soft); color:var(--ok)}
.b.warn{background:var(--warn-soft); color:var(--warn)}
.b.risk{background:var(--risk-soft); color:var(--risk)}
.b.flat{background:var(--surface-2); color:var(--ink-2)}
.b.flat::before{display:none}

/* ---------- day nav ---------- */
.daynav{display:flex; gap:6px; overflow-x:auto; padding:2px 0 12px; scrollbar-width:none}
.daynav::-webkit-scrollbar{display:none}
.dbtn{
  appearance:none; border:1px solid var(--line); background:var(--surface); cursor:pointer;
  border-radius:10px; padding:7px 11px; white-space:nowrap; text-align:left; line-height:1.15;
}
.dbtn b{display:block; font-family:var(--f-disp); font-size:.86rem; font-weight:600}
.dbtn i{display:block; font-style:normal; font-family:var(--f-mono); font-size:.62rem; color:var(--ink-3); text-transform:uppercase; letter-spacing:.06em}
.dbtn[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:#fff}
.dbtn[aria-pressed="true"] i{color:rgba(255,255,255,.75)}

/* ---------- day head ---------- */
.dayhead{margin-bottom:14px}
.dayhead h2{font-size:1.5rem; line-height:1.15; font-weight:700}
.daymeta{display:flex; flex-wrap:wrap; gap:6px; margin-top:9px}

/* ---------- timeline ---------- */
.tl{position:relative; padding-left:58px}
.tl::before{content:""; position:absolute; left:47px; top:6px; bottom:6px; width:1px; background:var(--line)}
.stop{position:relative; padding-bottom:14px}
.stop .t{
  position:absolute; left:-58px; top:12px; width:42px; text-align:right;
  font-family:var(--f-mono); font-size:.76rem; font-weight:500; color:var(--ink-2); font-variant-numeric:tabular-nums
}
.stop .dot{position:absolute; left:-13px; top:18px; width:9px; height:9px; border-radius:50%; background:var(--line); border:2px solid var(--ground)}
.stop.key .dot{background:var(--accent)}
.stop.now .dot{background:var(--brick); box-shadow:0 0 0 4px var(--brick-soft)}
.stop .box{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 13px; box-shadow:var(--shadow)}
.stop.now .box{border-color:var(--brick)}
.stop h3{font-size:1rem; font-weight:600; line-height:1.3}
.stop h3 .v{
  display:inline-block; font-family:var(--f-mono); font-size:.66rem; font-weight:600;
  background:var(--accent-soft); color:var(--accent); border-radius:5px; padding:1px 5px; margin-left:5px; vertical-align:2px
}
.stop p{margin:6px 0 0; font-size:.9rem; color:var(--ink-2)}
.stop p.warnline{color:var(--risk); font-weight:500}
.meta{display:flex; flex-wrap:wrap; gap:6px; margin-top:9px; align-items:center}
.pill{
  font-family:var(--f-mono); font-size:.68rem; background:var(--surface-2); color:var(--ink-2);
  border-radius:6px; padding:2px 7px; white-space:nowrap
}
.pill.money{color:var(--ink); font-weight:500}
.maplink{
  font-family:var(--f-mono); font-size:.68rem; text-decoration:none; color:var(--accent);
  border:1px solid var(--accent); border-radius:6px; padding:2px 7px; white-space:nowrap
}
.src{font-family:var(--f-mono); font-size:.64rem; color:var(--ink-3); text-decoration:none; border-bottom:1px dotted var(--ink-3)}

/* ---------- hop (tragitto) ---------- */
.hop{
  margin-top:9px; background:var(--accent-soft); border-radius:8px; padding:9px 10px;
  font-family:var(--f-mono); font-size:.76rem; line-height:1.5; color:var(--ink)
}
.hop b{font-weight:600}

/* ---------- food block ---------- */
.foodblock{margin-top:6px}
.fitem{display:flex; gap:10px; padding:10px 0; border-top:1px solid var(--line)}
.fitem:first-of-type{border-top:0}
.fitem .fmain{flex:1; min-width:0}
.fitem h4{font-size:.94rem; font-weight:600}
.fitem p{margin:3px 0 0; font-size:.86rem; color:var(--ink-2)}
.fprice{font-family:var(--f-mono); font-size:.8rem; font-weight:600; white-space:nowrap; text-align:right}
.fprice small{display:block; font-weight:400; font-size:.68rem; color:var(--ink-3)}

/* ---------- steps ---------- */
ol.steps{counter-reset:s; list-style:none; padding:0; margin:12px 0 0}
ol.steps li{
  counter-increment:s; position:relative; padding:0 0 14px 38px; font-size:.92rem; color:var(--ink-2)
}
ol.steps li::before{
  content:counter(s); position:absolute; left:0; top:-1px; width:25px; height:25px; border-radius:50%;
  background:var(--accent); color:#fff; font-family:var(--f-mono); font-size:.76rem; font-weight:600;
  display:flex; align-items:center; justify-content:center
}
ol.steps li b{color:var(--ink)}
ol.steps li:last-child{padding-bottom:0}

/* ---------- callout ---------- */
.call{border-radius:12px; padding:13px; font-size:.9rem; border:1px solid}
.call h4{font-size:.95rem; font-weight:700; margin-bottom:5px}
.call p{margin:0}
.call p + p{margin-top:7px}
.call.do{background:var(--ok-soft); border-color:color-mix(in srgb,var(--ok) 30%,transparent); color:var(--ink)}
.call.stop{background:var(--risk-soft); border-color:color-mix(in srgb,var(--risk) 32%,transparent); color:var(--ink)}
.call.note{background:var(--warn-soft); border-color:color-mix(in srgb,var(--warn) 32%,transparent); color:var(--ink)}
.call.do h4{color:var(--ok)} .call.stop h4{color:var(--risk)} .call.note h4{color:var(--warn)}

/* ---------- table ---------- */
.tw{overflow-x:auto; -webkit-overflow-scrolling:touch; border:1px solid var(--line); border-radius:12px; background:var(--surface)}
table{border-collapse:collapse; width:100%; font-size:.86rem; min-width:420px}
th,td{padding:9px 11px; text-align:left; border-bottom:1px solid var(--line); vertical-align:top}
th{font-family:var(--f-mono); font-size:.66rem; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-3); font-weight:500}
tr:last-child td{border-bottom:0}
td.num{font-family:var(--f-mono); font-variant-numeric:tabular-nums; white-space:nowrap}

/* ---------- phrase ---------- */
.ph{display:flex; gap:11px; padding:11px 0; border-bottom:1px solid var(--line); align-items:flex-start}
.ph:last-child{border-bottom:0}
.ph .sit{flex:0 0 33%; font-size:.84rem; color:var(--ink-3)}
.ph .say{flex:1}
.ph .say b{font-family:var(--f-mono); font-size:.9rem; color:var(--ink); font-weight:600; display:block}
.ph .say i{font-style:normal; font-size:.78rem; color:var(--ink-3)}

/* ---------- sos ---------- */
.sos-card{border:2px solid var(--ink); border-radius:12px; padding:15px; background:var(--surface)}
.addr{font-family:var(--f-mono); font-size:1.15rem; line-height:1.5; font-weight:600; white-space:pre-wrap; margin:0}
.addr.empty{color:var(--ink-3); font-weight:400; font-size:.95rem}
.mini{appearance:none; background:var(--surface-2); border:1px solid var(--line); color:var(--ink-2);
  border-radius:7px; padding:4px 10px; font-family:var(--f-mono); font-size:.7rem; cursor:pointer}
.mini:hover{border-color:var(--accent); color:var(--accent)}
.fields{display:flex; flex-direction:column; gap:9px; margin-top:12px}
.fields label{display:flex; flex-direction:column; gap:4px; font-size:.72rem; font-family:var(--f-mono);
  text-transform:uppercase; letter-spacing:.08em; color:var(--ink-3)}
.fields input,.fields textarea{
  font-family:var(--f-mono); font-size:.95rem; color:var(--ink); background:var(--ground);
  border:1px solid var(--line); border-radius:8px; padding:9px 10px; width:100%; resize:vertical}
.fields input:focus,.fields textarea:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent)}
.privacy{font-size:.76rem; color:var(--ink-3); margin:10px 0 0; line-height:1.5}
.nums{list-style:none; padding:0; margin:0}
.nums li{display:flex; justify-content:space-between; gap:12px; padding:8px 0; border-bottom:1px solid var(--line); font-size:.9rem}
.nums li:last-child{border-bottom:0}
.nums b{font-family:var(--f-mono); font-weight:600; white-space:nowrap}

/* ---------- barra aggiornamento ---------- */
.updbar{
  position:fixed; left:0; right:0; bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px));
  z-index:60; background:var(--brick); color:#fff; display:none;
  padding:11px 14px; font-size:.88rem; font-weight:500;
  box-shadow:0 -2px 12px rgba(0,0,0,.18);
}
.updbar.on{display:flex; align-items:center; gap:10px; justify-content:center}
.updbar button{
  appearance:none; border:1px solid rgba(255,255,255,.8); background:rgba(255,255,255,.14);
  color:#fff; border-radius:8px; padding:5px 12px; font-family:var(--f-mono); font-size:.74rem; cursor:pointer
}
.updbar button:hover{background:rgba(255,255,255,.28)}

.foot{padding:26px 0 30px; color:var(--ink-3); font-size:.78rem; text-align:center; line-height:1.6}
.legend{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px}

@media print{
  .tabs,.top,.daynav,.noprint{display:none!important}
  body{padding:0; background:#fff; color:#000}
  .panel{display:none!important}
  #p-sos{display:block!important}
  .sos-card{border-color:#000; box-shadow:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
</style>

<header class="top">
  <div class="top-in">
    <div class="brand">Sei giorni sull'<span>Øresund</span></div>
    <div class="clock" id="clock"></div>
    <a class="askbtn" href="https://claude.ai/code" target="_blank" rel="noopener" title="Chiedi una modifica a Claude">
      <svg viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.9 8.9 0 0 1-4-.9L3 21l1.9-4.9A8.4 8.4 0 0 1 12 3.1a8.4 8.4 0 0 1 9 8.4Z"/></svg>
      chiedi
    </a>
  </div>
</header>

<main class="wrap">
  <section id="p-oggi" class="panel on"></section>
  <section id="p-giorni" class="panel"></section>
  <section id="p-biglietti" class="panel"></section>
  <section id="p-cibo" class="panel"></section>
  <section id="p-parlare" class="panel"></section>
  <section id="p-sos" class="panel"></section>
</main>

<div class="updbar" id="updbar" role="status">
  <span>C’è una versione aggiornata</span>
  <button type="button" id="updbtn">aggiorna ora</button>
</div>

<nav class="tabs" aria-label="Sezioni">
  <div class="tabs-in" role="tablist">
    <button class="tab" role="tab" aria-selected="true" data-p="oggi">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Oggi</button>
    <button class="tab" role="tab" aria-selected="false" data-p="giorni">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Giorni</button>
    <button class="tab" role="tab" aria-selected="false" data-p="biglietti">
      <svg viewBox="0 0 24 24"><path d="M3 8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4Z"/><path d="M14 6v12"/></svg>Biglietti</button>
    <button class="tab" role="tab" aria-selected="false" data-p="cibo">
      <svg viewBox="0 0 24 24"><path d="M5 3v8a3 3 0 0 0 6 0V3M8 11v10"/><path d="M18 3c-1.7 1.5-2.5 3.5-2.5 6 0 1.7.8 2.6 2.5 2.6V21"/></svg>Cibo</button>
    <button class="tab" role="tab" aria-selected="false" data-p="parlare">
      <svg viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.9 8.9 0 0 1-4-.9L3 21l1.9-4.9A8.4 8.4 0 0 1 12 3.1a8.4 8.4 0 0 1 9 8.4Z"/></svg>Parlare</button>
    <button class="tab" role="tab" aria-selected="false" data-p="sos">
      <svg viewBox="0 0 24 24"><path d="M12 3 3 7v6c0 4.5 3.8 7.6 9 8 5.2-.4 9-3.5 9-8V7Z"/><path d="M12 9v4M12 16h.01"/></svg>SOS</button>
  </div>
</nav>

<script>
/* =========================================================================
   DATI — ogni fatto porta il suo bollino di verifica.
   ok   = fonte ufficiale controllata il 21/08/2026
   warn = da ricontrollare sul posto (stagionale, a esaurimento, meteo)
   risk = non confermato
   ========================================================================= */

const M = (q) => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q);

const DAYS = [
{
 id:"lun", iso:"2026-08-24", label:"Lun 24", sub:"Arrivo",
 title:"Arrivo, spesa, e il porto la sera stessa",
 lede:"Atterri all’ora di pranzo. Casa è a una fermata di metro. Il centro lo vedi la sera, con calma.",
 sun:"20:26",
 stops:[
  {t:"12:55", h:"Atterraggio", b:"Ryanair da Roma. Prendi i bagagli con calma: oggi non hai un solo orario da rispettare."},
  {t:"13:20", h:"Macchinetta danese → City Pass Small 120 ore", key:1,
   b:"Cerca «City Pass», poi Small, poi 120 hours, Adult × 1. Carta contactless. Esce un biglietto di carta con data e ora stampate: quello è tutto.",
   warn:"Il conteggio parte dall’acquisto, non dall’attivazione. Comprato alle 13:20 di lunedì scade sabato alle 13:20 — ed è per questo che sabato pomeriggio ti serve un singolo.",
   price:"340 DKK", badge:["ok","City Pass"]},
  {t:"13:35", h:"A Kastrup", hop:"<b>M2</b> dir. <b>Vanløse</b> → <b>prima fermata: KASTRUP</b>. Circa 2 minuti.", map:"Kastrup St København metro"},
  {t:"13:45", h:"Qualcosa al volo, con la valigia dietro", key:1,
   b:"<b>Compra qui, in aeroporto, prima di scendere in metro.</b> Il <b>7-Eleven del Terminal 3, lato arrivi</b> — prima dei controlli, sulla strada che fai comunque — è aperto fino alle 22 e fa panini e dolci sui <b>30–50 corone</b>. Indichi e paghi, non si parla. Prendi anche una bottiglia d’acqua.",
   b2:"<b>Perché in aeroporto e non a Kastrup:</b> attorno alla fermata non c’è niente a portata di valigia. I supermercati veri sono a <b>1,2 km</b>, e ci vai dopo il check-in. Comprare qui ti fa arrivare al mare con il pranzo già in mano, che è tutto il punto della giornata.",
   b2:"<b>Guardati intorno anche sotto casa.</b> Kastrup è un quartiere vero, non un dormitorio: forni, grill, pizzerie al taglio. Quello che vedi aperto e pieno di gente del posto va bene — non serve che sia in questa lista. Quella completa, <b>Burger 161</b> compreso, è nella scheda <b>Cibo</b>.",
   badge:["warn","locali da elenchi danesi: orari sul posto"], map:"Saltværksvej Kastrup"},
  {t:"14:05", h:"Kastrup Søbad — «la lumaca»", v:8, key:1,
   b:"Un anello di legno che entra nel mare, White Arkitekter 2005, con il trampolino a cinque metri in fondo al pontile. Davanti hai Saltholm e, in fondo, la Svezia. È il primo assaggio di Danimarca migliore di Nyhavn, ed è pieno di gente di qui e di nessun turista.",
   b2:"<b>Gratis, aperta tutto l’anno</b>, spogliatoi e docce aperti d’estate. <b>Dalla fermata Kastrup sono 1,2 km, 15 minuti, tutto pianeggiante</b> lungo il Kastrup Strandpark — misurato, non stimato. Con la valigia si fa.",
   warn:"Ti siedi sul bordo del pontile con il pranzo comprato in aeroporto e la Svezia davanti. <b>È il posto migliore della zona e non costa niente.</b> Poi torni indietro per le 15, stessa strada.",
   price:"gratis", badge:["ok","distanza misurata su Maps, 23 agosto"], src:"https://www.visitcopenhagen.com/copenhagen/planning/kastrup-sea-bath-gdk412208", map:"Kastrup Søbad"},
  {t:"15:00", h:"Check-in", key:1,
   b:"Disfa la valigia, metti la carta d’identità nel portafoglio — martedì ti serve in tasca, non in borsa.",
   warn:"<b>L’orario dell’host è le 15:00</b>, non prima. Se stasera gli scrivi e ti lascia posare i bagagli verso le 13:45, tutto il pomeriggio si allarga: la lumaca la fai leggero e la spesa la anticipi. È una richiesta normale, chiedila.",
   badge:["warn","conferma l’ora esatta con l’host"]},
  {t:"15:20", h:"Spesa a Kastrup", key:1,
   b:"È la spesa che regge tutta la settimana: colazioni, pranzi al sacco, cene a casa. Rugbrød, burro salato, aringa marinata, koldskål con i kammerjunker, frutta, caffè.",
   b2:"<b>Dove:</b> in <b>Kastruplundgade</b> ci sono un <b>Netto</b> e un <b>365discount</b> uno di fronte all’altro, <b>1,2 km dalla fermata, 16 minuti a piedi</b>, aperti fino alle 22. Sono i due più vicini a te e sono entrambi discount. <b>Non</b> andare al Rema 1000 di Præstefælledvej: è a 4,7 km, un’ora a piedi.",
   warn:"Il sacchetto <b>si paga</b> e te lo chiedono (<i>«pose?»</i>): portati una borsa da casa e la domanda non arriva nemmeno. E le bottiglie hanno la cauzione, il <i>pant</i>, che riprendi dalla macchina all’ingresso del supermercato — dettagli nella scheda Cibo.",
   b2:"<b>Cosa metterci dentro sta nella scheda Cibo</b>, blocco «Il carrello del lunedì»: la lista con il nome danese di ogni cosa, i prezzi indicativi, e come si monta un <i>madpakke</i> — il pranzo al sacco che sulla settimana ti fa risparmiare 200–400 corone.",
   badge:["warn","orari da confermare sul posto"], map:"Rema 1000 Præstefælledvej Kastrup"},
  {t:"16:00", h:"Verso il centro", hop:"<b>M2</b> dir. <b>Vanløse</b> → scendi a <b>Kongens Nytorv</b>."},
  {t:"16:20", h:"Nyhavn", v:8, key:1, b:"Le case colorate del Seicento, a duecento metri dall’uscita della metro. Poi cinque minuti a nord fino a <b>Ofelia Plads</b> <span class='v'>7</span>, il molo con le scale che scendono in acqua: è dove si siedono i danesi dopo il lavoro, e non c’è un turista.", price:"gratis", badge:["ok","sempre aperto"], map:"Nyhavn, København"},
  {t:"17:15", h:"Amalienborg", v:8, key:1,
   b:"La piazza ottagonale con le quattro regge e le guardie in servizio. La piazza è all’aperto e sempre accessibile.",
   warn:"CORRETTO: la <b>Marmorkirken chiude alle 17:00</b> da lunedì a giovedì. A quest’ora la trovi chiusa — è stata tolta da oggi. La cupola poi si visita <b>solo mar–dom alle 13:30</b>, un giro al giorno, max 15 persone, senza prenotazione.",
   badge:["ok","verificato su marmorkirken.dk"], src:"https://www.marmorkirken.dk/", map:"Amalienborg Slotsplads"},
  {t:"18:15", h:"Cena: Killer Kebab", v:8,
   b:"Borgergade 18, a cinque minuti da Amalienborg. Kebab marinato in casa e falafel dentro un pane piatto a lievito madre sfornato lì. Da asporto: si mangia camminando verso Kastellet.",
   b2:"<b>Sì, ti chiedono cosa metterci dentro — tre domande, e le risposte sono corte.</b> <b>1</b> Il pane: <i>durum</i> (piadina arrotolata, la più comoda camminando), <i>pita</i> (tasca, più abbondante) o <i>box</i> (vaschetta con patate). Di’ <b>«durum»</b>. <b>2</b> La verdura: chiedono <i>«alt i?»</i>, cioè «dentro tutto?». Di’ <b>«yes, everything»</b> e arriva insalata, pomodoro, cipolla, cavolo. <b>3</b> La salsa: <i>hvidløg</i> è aglio, <i>stærk</i> è piccante, <i>mild</i> è dolce. Se non sai, <b>«garlic, mild»</b> e non sbagli.",
   price:"90–110 DKK", badge:["ok","lun–gio 11:30–20:30"], map:"Killer Kebab Borgergade 18"},
  {t:"19:15", h:"Kastellet", v:8, b:"La fortezza a stella del 1662, ancora militare, coi bastioni erbosi e il mulino. Si cammina sul perimetro al tramonto. Poi <b>Gefionspringvandet</b> <span class='v'>7</span> e, se ti va, la <b>Sirenetta</b> <span class='v'>5</span> — piccola e sempre circondata, ma è lì.", price:"gratis", badge:["ok","sempre aperto"], map:"Kastellet København"},
  {t:"20:26", h:"Tramonto", b:"Oggi il sole va giù alle 20:26. Dai bastioni di Kastellet guarda verso l’Øresund: domani sei dall’altra parte.", badge:["ok","effemeridi verificate"]},
  {t:"20:45", h:"Rientro", hop:"<b>Østerport</b> → <b>M3/M4</b> → <b>Kongens Nytorv</b> → <b>M2</b> dir. <b>Vanløse</b> → <b>KASTRUP</b>."}
 ],
 food:{
  intro:"Oggi mangi con quello che compri. L’unica cosa da fuori è la cena, ed è a cinque minuti dal punto in cui ti trovi.",
  items:[
   {n:"Killer Kebab", w:"Borgergade 18 — sulla strada fra Amalienborg e Kastellet. Da asporto.", p:"90–110", u:"DKK", h:"lun–gio 11:30–20:30", badge:"ok", map:"Killer Kebab Borgergade 18"},
   {n:"DØP · Den Økologiske Pølsemand", w:"Il carretto dell’hot dog biologico. Købmagergade 52 (sotto la Rundetårn) e Helligåndskirken sullo Strøget. <b>Chiude alle 18</b>: se scendi in centro presto, è qui che spendi 5 euro e mangi la cosa più danese del viaggio.", p:"34–39", u:"DKK", h:"lun–ven 11:00–18:00", badge:"ok", map:"DØP Købmagergade 52"},
   {n:"BUKA Bakery", w:"Frederiksberggade 21 e Nytorv 3, in mezzo allo Strøget. Aperta tutti i giorni fino alle 19: è il ripiego che funziona sempre.", p:"~58", u:"DKK croissant", h:"tutti i giorni 7–19", badge:"warn", map:"BUKA Bakery Frederiksberggade 21"},
   {n:"Spesa a Kastrup", w:"Netto / Rema 1000 / Lidl. Da qui escono le colazioni di sei giorni e i pranzi al sacco.", p:"~250", u:"DKK settimana", h:"vedi Google Maps", badge:"warn", map:"Netto Kastrup"}
  ]
 }
},
{
 id:"mar", iso:"2026-08-25", label:"Mar 25", sub:"Svezia",
 title:"Svezia: Lund la mattina, Malmö fino al tramonto",
 lede:"La stazione per la Svezia è dentro il tuo aeroporto, a una fermata da casa. Tutta la mattina è costruita attorno all’orologio del duomo che suona a mezzogiorno.",
 sun:"20:24",
 stops:[
  {t:"09:00", h:"Attiva il biglietto svedese", key:1,
   b:"Se l’hai comprato in anticipo nell’app Skånetrafiken, <b>attivalo adesso</b>. Non c’è nessun vantaggio ad aspettare: 24 ore da adesso significa fino a mercoledì mattina, e stasera torni alle 22.",
   warn:"Se invece l’app te l’ha già attivato ieri, il biglietto stasera è SCADUTO. Controlla prima di uscire di casa.",
   badge:["ok","§4.3.3 condizioni Skånetrafiken"]},
  {t:"09:45", h:"All’aeroporto", hop:"<b>M2</b> dir. <b>Vanløse</b> → <b>Lufthavnen</b>. Una fermata. Poi segui i cartelli <b>Tog / Trains</b>: la stazione dei treni è <b>265 m a piedi</b> dalla metro, dentro l’aeroporto."},
  {t:"10:15", h:"Verso Lund", key:1,
   hop:"<b>CPH Airport Kastrup</b> → <b>Øresundståg</b> → il display deve dire <b>Lund C</b> (o Helsingborg / Göteborg / Kalmar) → <b>Lund C</b>. 37 min.",
   b:"Partenze reali di oggi: <b>10:15 · 10:30 · 10:45 · 11:00</b>, arrivo <b>10:52 · 11:09 · 11:22 · 11:39</b>. Molti treni terminano a Malmö C e non proseguono: se il display dice solo «Malmö C», sali lo stesso e cambia lì. Il tuo biglietto copre entrambe le cose.",
   badge:["ok","orari verificati alla data reale"]},
  {t:"10:52", h:"Lund C", b:"Il duomo è a <b>otto minuti a piedi</b> dalla stazione, dritto per Bangatan e Kyrkogatan.", map:"Lund C station"},
  {t:"11:05", h:"Domkyrkan", v:10, key:1, b:"Duomo romanico del 1145: tre navate di arenaria e la cripta con le colonne scolpite. Entra e guarda, poi esci e torna per mezzogiorno.", price:"gratis", badge:["ok","fonte ufficiale"], src:"https://www.svenskakyrkan.se/lundsdomkyrka/det-astonomiska-uret", map:"Lunds domkyrka"},
  {t:"11:30", h:"Lundagård e l’Università", v:7, b:"Il parco davanti al duomo, con la casa del re del 1584 e il palazzo bianco dell’ateneo. Venti minuti, poi rientra.", price:"gratis"},
  {t:"11:55", h:"L’orologio astronomico — ore 12:00", v:10, key:1,
   b:"<b>Sii dentro alle 11:55.</b> Suona <i>In dulci jubilo</i> dal più piccolo organo della cattedrale, nascosto dentro l’orologio; si aprono le porticine, i Re Magi sfilano davanti alla Madonna e due trombettieri alzano gli strumenti. Dura pochi minuti. È l’appuntamento della giornata.",
   b2:"Se lo perdi lo rifà alle 15:00 — ma vorrebbe dire restare a Lund fino alle tre e tagliare mezza Malmö.",
   badge:["ok","12:00 e 15:00, lun–sab"]},
  {t:"12:20", h:"Pranzo: Lundafalafel", v:8, key:1,
   b:"Stora Södergatan 5, accanto al negozio Lindex, a pochi minuti dal duomo. Un buco nel muro con due panche fuori: <b>rulle di falafel a 30 corone svedesi</b>, il preferito degli studenti. È il pasto più economico dell’intera settimana. Si mangia camminando.",
   price:"30–45 SEK", badge:["ok","prezzo verificato"], map:"Lundafalafel Stora Södergatan 5 Lund"},
  {t:"12:50", h:"Botaniska trädgården", v:7, b:"Dieci minuti a piedi dall’altra parte del centro. <b>Le serre sono chiuse per restauro fino al 2027</b>: resta il giardino all’aperto, otto ettari, aperto fino alle 20. Bello e gratuito, ma non è più il motivo per venire a Lund.", price:"gratis", badge:["ok","serre chiuse, fonte ufficiale"], src:"https://www.botan.lu.se/renovering-av-vara-vaxthus", map:"Botaniska trädgården Lund"},
  {t:"13:40", h:"A Malmö", hop:"<b>Lund C</b> → <b>Øresundståg</b> dir. <b>Malmö C</b> / Københavns Lufthavn → <b>Malmö C</b>. 13 min."},
  {t:"14:10", h:"Malmö Saluhall", v:8, b:"Cinque minuti a piedi dalla stazione, Gibraltargatan 6: un magazzino di mattoni riconvertito in mercato coperto. Qui si guarda e si prende qualcosa di piccolo — hai già mangiato a Lund.", price:"90–130 SEK", badge:["ok","lun–gio 11–20"], src:"https://www.malmosaluhall.se/en/welcome/", map:"Malmö Saluhall"},
  {t:"15:00", h:"Lilla Torg e Gamla Staden", v:7, b:"Dieci minuti a piedi verso ovest. La piazzetta di case a graticcio del Cinquecento, di quando Malmö era danese. <b>Guarda e non sederti</b>: qui un caffè costa il doppio.", price:"gratis"},
  {t:"15:40", h:"Malmö Konsthall", v:8, key:1, b:"Quindici minuti a piedi. Una delle più grandi sale espositive d’Europa, col soffitto di 550 lucernari. <b>Il martedì chiude alle 17</b>: è il motivo per cui viene prima della biblioteca.", price:"gratis", badge:["ok","mar 11–17"], src:"https://malmokonsthall.se/en/visit-us/", map:"Malmö Konsthall"},
  {t:"16:30", h:"Malmö Stadsbibliotek", v:8, b:"Cinque minuti, dall’altra parte di Kungsparken. Il cubo di vetro di Henning Larsen, <i>Ljusets kalender</i>, attaccato al castello di mattoni del 1901. Per uno a cui piacciono le biblioteche è la migliore del viaggio dopo il Diamante Nero — e qui si entra e basta.", price:"gratis", badge:["warn","mar ~9–21, conferma in loco"], map:"Malmö Stadsbibliotek"},
  {t:"17:20", h:"Örum Bageri", v:8, key:1,
   b:"NUOVO. Citadellsvägen 23, esattamente sulla strada fra la biblioteca e il porto. Bulle al cardamomo, croissant al pecorino e kimchi. <b>Aperta martedì fino alle 18:00</b>: se ci arrivi entro le 17:40 sei dentro, altrimenti salta e vai avanti.",
   badge:["ok","mar–ven 7:30–18"], map:"Örum Bageri Citadellsvägen 23 Malmö"},
  {t:"17:45", h:"Slottsträdgården e Malmöhus da fuori", v:8, b:"Otto giardini a tema attorno al castello col fossato, roseto e giardino giapponese. L’esterno vale più dell’interno, e non costa niente.", price:"gratis", badge:["ok","fonte ufficiale"], src:"https://malmo.se/"},
  {t:"18:15", h:"Västra Hamnen e Turning Torso", v:8,
   b:"Venti minuti a piedi lungo il canale. Il grattacielo di Calatrava che ruota di 90 gradi — <b>non è più il più alto di Scandinavia</b> (dal 2022 lo è il Karlatornet di Göteborg) e i piani panoramici <b>si visitano solo giovedì, venerdì e sabato</b>: oggi si guarda da fuori. Poi il lungomare fra <b>Scaniaparken</b> e <b>Daniaparken</b>, dove ci si tuffa dalle scogliere di cemento.",
   price:"gratis", map:"Turning Torso Malmö"},
  {t:"18:15", h:"L’alternativa forte: Ribersborgs Kallbadhus", v:8,
   b:"Bagno freddo del 1898 su palafitte in mare aperto, <b>sei saune</b> e il tuffo nell’Øresund. <b>Martedì 09:00–21:00, 90 SEK.</b> In sauna il costume non è ammesso: lato uomini e lato donne, separati. Se ci vai, salta Slottsträdgården e arrivaci alle 17:30 — due ore, e ne esci che è un’altra vacanza.",
   price:"90 SEK", badge:["ok","orari e prezzo verificati"], src:"https://www.ribersborgskallbadhus.se/bad", map:"Ribersborgs Kallbadhus"},
  {t:"20:24", h:"Tramonto sull’Øresund", b:"Alle 20:24, dritto sull’acqua, con la Danimarca in faccia.", badge:["ok","effemeridi verificate"]},
  {t:"21:20", h:"Rientro", key:1,
   hop:"<b>Malmö C</b> → <b>Øresundståg</b> dir. <b>Københavns Lufthavn</b> / København H → <b>Københavns Lufthavn</b> (~22 min) → <b>M2</b> dir. <b>Vanløse</b> → <b>prima fermata: KASTRUP</b>.",
   b:"A casa verso le 22:00. <b>Non hai fretta:</b> i treni passano di continuo fino a tarda sera e poi uno all’ora tutta la notte. Non esiste lo scenario in cui resti bloccato in Svezia — e il tuo biglietto è valido fino a domani mattina.",
   badge:["warn","orario esatto: controlla Google Maps"]}
 ],
 food:{
  intro:"Oggi è l’unico giorno in corone svedesi, ed è anche il giorno in cui si mangia meglio spendendo meno. Il falafel è la risposta: Malmö e Lund ne sono la capitale nordica.",
  items:[
   {n:"Lundafalafel", w:"Stora Södergatan 5, Lund, accanto a Lindex. Rulle in due misure, si mangia in piedi o al parco.", p:"30–45", u:"SEK", h:"pranzo", badge:"ok", map:"Lundafalafel Stora Södergatan 5 Lund"},
   {n:"Möllevångstorget", w:"La piazza più multietnica di Scandinavia, a 20 min a piedi da Malmö C (o pochi minuti di bus, <b>incluso nel tuo biglietto</b>). Un rullo di falafel enorme sta sulle 70–75 SEK.", p:"70–75", u:"SEK", h:"mercato la mattina", badge:"warn", map:"Möllevångstorget Malmö"},
   {n:"Örum Bageri", w:"Citadellsvägen 23, sulla strada del pomeriggio. Bulle al cardamomo, croissant salati.", p:"—", u:"", h:"mar–ven 7:30–18", badge:"ok", map:"Örum Bageri Citadellsvägen 23 Malmö"},
   {n:"Malmö Saluhall", w:"Gibraltargatan 6, cinque minuti da Malmö C. Mercato coperto: qui si assaggia, non si pranza — costa da centro città.", p:"90–130", u:"SEK", h:"lun–gio 11–20", badge:"ok", map:"Malmö Saluhall"},
   {n:"Cena", w:"Torni a casa alle 22. Mangia qualcosa di leggero a Malmö prima di salire, oppure tieni pronto qualcosa in frigo: dopo un giorno intero in piedi, la cena a casa è la scelta giusta.", p:"—", u:"", h:"", badge:"flat"}
  ]
 }
},
{
 id:"mer", iso:"2026-08-26", label:"Mer 26", sub:"Ritmo lento",
 title:"Il mercoledì gratis, senza scarpinate",
 lede:"Rifatto sulle gambe di ieri: metà chilometri, la metro e il bus dove prima si camminava, e nessuna salita. <b>I due musei gratis ci sono tutti e due</b> — chiudono alle 17, quindi il pomeriggio è pieno e la sera è vuota apposta. <b>La torre di Christiansborg si sale, ed è gratis</b> — 106 metri, con l’ascensore, aperta fino alle 21: per questo sta <b>dopo</b> i musei, è l’unica cosa che alle 17 non chiude. La <b>Rundetårn</b> invece resta fuori: costa 60 corone e quest’anno l’osservatorio è chiuso per il restauro della cupola. Ma <b>la sua chiesa si visita gratis</b>, ha una porta sua, ed è sulla strada fra il pranzo e Slotsholmen: è entrata nel piano al posto di un cambio di metro. <b>Se parti tardi</b>, l’unico orario che non si recupera è <b>le 17</b>: è quando chiudono i due musei, e il Glyptotek è gratis solo oggi. Si taglia in quest’ordine, dall’alto: Davids Samling (è gratis sempre, ci torni quando vuoi), poi la panchina a Kongens Have, poi la chiesa, poi Thorvaldsens. Il Glyptotek per ultimo — e la torre, che chiude alle 21, non la tagli comunque.",
 sun:"20:21",
 stops:[
  {t:"09:45", h:"Verso Nørreport", hop:"<b>M2</b> dir. <b>Vanløse</b> → <b>Nørreport</b>. 25 minuti seduto."},
  {t:"10:20", h:"Il bus 5C verso Nørrebro", key:1,
   hop:"<b>Nørreport</b> → <b>bus 5C</b> dir. <b>Herlev Hospital</b> (o <b>Husum Torv</b>) → scendi a <b>Elmegade</b>. 5–6 minuti.",
   b:"Si sale <b>dalla porta davanti</b>: passi accanto all’autista e gli mostri il biglietto di carta, un cenno e sei dentro. <b>Non si timbra niente</b> e non c’è nessuna macchinetta da toccare. Si scende dalle porte di mezzo, premendo <b>STOP</b>.",
   b2:"Il 5C passa in continuazione, non ti serve un orario. Sul display sopra il parabrezza c’è il capolinea; la fermata la leggi sul display dentro il bus, come in metro: <b>non contare le fermate</b>.",
   badge:["warn","fermata da leggere sul display"]},
  {t:"10:35", h:"Andersen &amp; Maillard — il cubo al pistacchio", v:9, key:1,
   b:"Nørrebrogade 62. È questa la panetteria del <i>cube croissant</i>: un croissant cotto dentro uno stampo quadrato, spigoli caramellati fuori e crema al pistacchio dentro. È il dolce che ha reso famoso questo posto fuori dalla Danimarca.",
   b2:"È anche una torrefazione, e <b>ci si siede</b> — che stamattina è metà del motivo per venirci. Al banco: «<b>one pistachio cube croissant and a coffee, please</b>».",
   price:"cubo ~50–65 · caffè ~40 DKK", badge:["warn","aperta ~7–19, prezzi da confermare al banco"], map:"Andersen Maillard Nørrebrogade 62"},
  {t:"11:30", h:"Ritorno in centro", hop:"<b>Elmegade</b> → <b>bus 5C</b> dir. <b>Københavns Lufthavn</b> → <b>Nørreport</b>. Stessa linea, marciapiede di fronte."},
  {t:"11:50", h:"Davids Samling", v:8, key:1,
   b:"Kronprinsessegade 30. La più bella collezione di arte islamica del Nord Europa dentro un palazzo borghese: tappeti, avori, acciai damascati, e le stanze del piano nobile lasciate come erano. <b>Gratis sempre</b>, anche oggi che non c’entra niente con l’ultimo mercoledì.",
   b2:"<b>Come si entra:</b> spingi la porta ed entri, c’è un banco subito dentro. Ti fermi e dici «<b>One, please</b>»: ti danno un <b>tagliando da zero corone</b> — è il biglietto, serve solo a contarti. Lo zaino grosso te lo fanno lasciare al guardaroba. Da lì sali e giri libero.",
   hop:"<b>Nørreport</b> → 900 metri a piedi attraverso <b>Kongens Have</b> → <b>Kronprinsessegade 30</b>. 11 minuti, tutto piano, e li fai nel parco invece che sul marciapiede.",
   price:"gratis", badge:["ok","mer 10–21, ingresso libero"], src:"https://www.davidmus.dk/en/", map:"Davids Samling Kronprinsessegade 30"},
  {t:"13:00", h:"Kongens Have, seduto", v:8,
   b:"Il museo dà sul giardino del re: esci e sei dentro. Prato, sedie, il Rosenborg in fondo. <b>Mezz’ora su una panchina è una tappa, oggi</b>, non un buco da riempire.",
   price:"gratis", badge:["ok","aperto fino a sera"], map:"Kongens Have København"},
  {t:"13:35", h:"Pranzo a Torvehallerne", v:8,
   b:"Frederiksborggade 21, addosso a Nørreport: dal giardino sono 900 metri. Due padiglioni di vetro, smørrebrød da 68 corone al pezzo, tacos di Hija de Sanchez da ~56, il caffè di Coffee Collective. <b>Compra e portalo fuori</b>, c’è la piazza davanti.",
   price:"70–150 DKK", badge:["ok","lun–ven 10–19"], map:"Torvehallerne København"},
  {t:"14:10", h:"Trinitatis, la chiesa della Rundetårn", v:7, key:1,
   hop:"<b>Torvehallerne</b> → a piedi per <b>Frederiksborggade</b> → <b>Kultorvet</b> → <b>Købmagergade</b>. 700 metri, 8 minuti, tutto piatto e pedonale.",
   b:"La Rundetårn è nata come campanile-osservatorio di questa chiesa, e la chiesa <b>ha una porta sua</b>: sta sul fianco di <b>Landemærket</b>, quello che sbuca su Købmagergade davanti al Regensen. <b>Quella porta non passa dalla biglietteria della torre</b>: spingi ed entri, non c’è nessun banco e non si paga niente. Dentro: navata bianca e oro, l’altare del 1731, l’organo. Dieci minuti, tutto al piano.",
   b2:"<b>Sulla torre, invece, non salgo.</b> Sono <b>~60 corone</b> — il sito ufficiale da qui non si apre, quindi il prezzo lo leggi alla cassa — e nel 2026 il telescopio è stato smontato e spedito in Germania per il restauro della cupola: <b>l’osservatorio riapre a ottobre</b>. Restano la rampa a spirale e la sala della biblioteca. Oggi la torre gratis e alta il triplo ce l’hai alle 17:20. <b>Il carretto DØP</b> degli hot dog biologici è esattamente sotto la torre, su Købmagergade: se il pranzo è stato leggero, è qui.",
   price:"gratis", badge:["warn","orari da controllare sulla porta"],
   src:"https://www.trinitatiskirke.dk/kontakt/aabningstider", map:"Trinitatis Kirke Landemærket København"},
  {t:"14:35", h:"A Slotsholmen, a piedi", key:1,
   hop:"<b>Købmagergade</b> in discesa → <b>Amagertorv</b> (la fontana) → <b>Højbro Plads</b>, la statua a cavallo → passi il <b>ponte</b> → sei a <b>Slotsholmen</b>. 800 metri, 10 minuti, tutto pedonale.",
   b:"È il pezzo centrale dello <b>Strøget</b> e non ci si perde: da Købmagergade vai sempre dritto in discesa finché la via si apre in piazza, poi tieni il canale davanti a te e attraversa. Il museo giallo-ocra è appena passato il ponte.",
   b2:"<b>Se le gambe non ci sono</b>, la metro c’è lo stesso, ma devi tornare indietro a Nørreport (600 m) e fare <b>M1 o M2 → Kongens Nytorv → M3 → Gammel Strand</b>, due fermate e un cambio. A conti fatti ci metti uguale: a piedi è più semplice e non devi leggere nessun cartello."},
  {t:"14:50", h:"Thorvaldsens Museum", v:8, key:1,
   b:"Il museo giallo-ocra accanto a Christiansborg, tutto per un solo scultore. <b>Oggi è gratis</b> perché è l’ultimo mercoledì del mese: negli altri giorni sono 110 corone.",
   b2:"<b>Come si entra:</b> banco all’ingresso, «<b>One, please — it’s free today, right?</b>», ti danno il biglietto e passi. Niente prenotazione, niente coda vera. <b>Onesto:</b> Thorvaldsen ha lavorato <b>quarant’anni a Roma</b> e i marmi non ti diranno niente di nuovo. Quello che si viene a vedere è la scatola: pareti pompeiane rosse, azzurre, gialle, i mosaici per terra, e lui sepolto nel cortile in mezzo alle sue statue. <b>Mezz’ora</b>, tutto al piano, e se non ti prende esci senza rimpianti: non hai pagato niente.",
   price:"gratis oggi · 110 DKK", badge:["ok","regola comunale verificata"], src:"https://cphmuseum.kk.dk/en/news/change-regarding-free-admission-on-wednesdays", map:"Thorvaldsens Museum"},
  {t:"15:35", h:"Al Glyptotek", hop:"<b>Gammel Strand</b> → <b>M3</b> dir. <b>Rådhuspladsen</b> → <b>København H</b>. Due fermate, poi 4 minuti a piedi lungo il Tivoli."},
  {t:"15:50", h:"Ny Carlsberg Glyptotek", v:9, key:1,
   b:"Rimesso, perché oggi è gratis e perché non è solo Egitto ed Etruria: c’è la <b>seconda collezione di Rodin al mondo</b>, i francesi (Gauguin, Degas, Van Gogh) e i danesi dell’Ottocento. E soprattutto c’è il <b>giardino d’inverno</b>: palme vere sotto una cupola di vetro, una fontana, e <b>sedie</b>. Con le gambe di oggi, quella sala da sola vale la tappa. <b>Una parte però è chiusa:</b> fino a ottobre stanno risistemando la scultura greca e romana e la sala centrale, quindi alcune sale sono chiuse e alcune opere non sono esposte. Rodin, i francesi e gli egizi restano.",
   b2:"<b>Come si entra:</b> passi comunque dal <b>banco della biglietteria</b>, dentro l’atrio. Anche nei giorni gratis il biglietto te lo danno lì, a zero corone: «<b>One, please — it’s free today, right?</b>». Aspettati <b>più gente del solito</b>, i mercoledì gratis sono i giorni pieni. Lo <b>zaino</b> va lasciato all’ingresso. <b>Non ti serve una moneta:</b> il guardaroba con gli attaccapanni è gratis e sorvegliato, e gli armadietti a moneta — dove ci sono — la moneta te la ridanno quando riapri. Se non ce l’hai, al banco: «<b>I don’t have a coin — can I leave my bag here?</b>» e te lo tengono loro. È un problema che risolvono dieci volte al giorno.",
   warn:"NON devi prenotare niente, e soprattutto <b>non comprare niente online</b>. Il sito vende <b>solo</b> biglietti a pagamento da 135–150 corone e il biglietto da 0 corone <b>non esiste</b>: se ne compri uno, sono soldi buttati in un giorno gratis. <b>Chiude alle 17</b>: entra entro le 16:15 e hai il tempo che serve.",
   price:"gratis oggi · 150 DKK", badge:["ok","gratis e orari verificati il 23 agosto"], src:"https://glyptoteket.com/visit/tickets", map:"Ny Carlsberg Glyptotek"},
  {t:"17:05", h:"Torni a Slotsholmen", key:1,
   hop:"<b>København H</b> → <b>M3</b> o <b>M4</b>, binario dove nell’elenco c’è <b>Gammel Strand</b> → scendi a <b>Gammel Strand</b>. Due fermate, poi 3 minuti a piedi.",
   b:"Qui M3 e M4 fanno lo stesso pezzo: <b>vanno bene tutte e due</b>, sali sulla prima che arriva."},
  {t:"17:20", h:"La torre di Christiansborg, in cima", v:8, key:1,
   b:"<b>106 metri, la più alta della città, e non costa niente.</b> È l’unica cosa aperta fino a <b>sera</b> nel giorno in cui tutto chiude alle 17: per questo sta qui e non nel pomeriggio. <b>Si sale in ascensore</b> — le scale non si possono usare nemmeno volendo — quindi la regola di oggi, zero salite, resta in piedi.",
   b2:"<b>Come si entra:</b> l’ingresso della torre è sul cortile, segui le indicazioni <b>Tårnet</b>. C’è un <b>controllo di sicurezza</b> come in aeroporto, zaino sul nastro, e poi l’ascensore. Non serve prenotare e non si paga: se qualcuno ti ferma, «<b>the tower, please</b>» basta. In cima lo spazio è poco e <b>ci può essere coda per l’ascensore</b>: se ne trovi tanta, torna dopo cena, chiude alle 21.",
   price:"gratis", badge:["ok","mar–sab 11–21, gratis"], src:"https://www.kongeligeslotte.dk/en/palaces-and-gardens/christiansborg-palace/the-tower.html", map:"Christiansborgs Tårn"},
  {t:"17:55", h:"A Nørrebro", key:1,
   hop:"<b>Gammel Strand</b> → <b>M3</b> (non la M4) → scendi a <b>Nørrebros Runddel</b>. ~18 minuti.",
   b:"Qui l’anello è quasi in pari: da un verso sono <b>8 fermate</b>, dall’altro <b>9</b>. <b>Prendi il primo treno che arriva, da qualunque binario</b> — l’unica cosa da controllare è che sul muso ci sia scritto <b>M3</b>: la M4 passa di qui ma a Nørrebro non ci va.",
   b2:"Prima di scendere: <b>leggi il nome sul display dentro il vagone</b>, non contare le fermate."},
  {t:"18:20", h:"Assistens Kirkegård", v:8, key:1,
   b:"Il cimitero del 1760 che i danesi usano come parco, e l’ingresso è a due passi dalla metro. Kierkegaard e Andersen sono qui, ma il punto è la gente sdraiata sull’erba a leggere. <b>D’estate aperto fino alle 22</b>: è il posto giusto per stare fermo un’ora prima di cena.",
   b2:"Superkilen, la piazza rossa e nera di BIG, è dieci minuti più a nord: oggi la lascerei perdere, ma se ti gira bene è lì.",
   price:"gratis", badge:["ok","estate 7–22"], map:"Assistens Kirkegård"},
  {t:"19:15", h:"Cena in Jægersborggade", v:8,
   b:"La via più bella di Nørrebro, e sbuca dal cimitero: botteghe, ceramisti, <b>Coffee Collective</b> e il gelato all’azoto liquido di <b>Istid</b>. La cena la componi camminando su duecento metri di strada, e poi ti siedi.",
   price:"varie", map:"Jægersborggade København"},
  {t:"21:00", h:"Rientro", key:1,
   hop:"<b>Nørrebros Runddel</b> → <b>M3</b>, il primo che arriva → <b>Kongens Nytorv</b> → cambi, <b>M2</b> dir. <b>Lufthavnen</b> → scendi a <b>KASTRUP</b>.",
   b:"A Nørrebros Runddel passa <b>solo la M3</b> e i due versi sono quasi uguali (8 fermate contro 9): non scegliere, sali sul primo.",
   b2:"⚠️ <b>A Kongens Nytorv sta l’unico errore possibile della giornata.</b> Sullo stesso binario arrivano <b>M1</b> e <b>M2</b>: solo la <b>M2</b> va a Kastrup, e sul muso c’è scritto <b>Lufthavnen</b>. Se sale la M1 (Vestamager) la lasci partire e aspetti tre minuti."}
 ],
 food:{
  intro:"Giornata a tappe corte: colazione grossa a Nørrebro, pranzo dentro Torvehallerne, cena a pezzi in Jægersborggade. Nessuno dei tre richiede di camminare per arrivarci.",
  items:[
   {n:"Andersen &amp; Maillard", w:"Colazione, Nørrebrogade 62. Il <b>cube croissant al pistacchio</b> e un caffè, seduto. Si ordina in inglese.", p:"~50–65", u:"DKK", h:"~7–19", badge:"warn", map:"Andersen Maillard Nørrebrogade 62"},
   {n:"Sankt Peders Bageri", w:"L’<i>onsdagssnegl</i> alla cannella esiste <b>solo il mercoledì</b>, dal forno del 1652. Non è sulla strada di oggi: sono 8 minuti a piedi da Nørreport, andata e ritorno. Se ci passi, comprala e portala via — regge fino a stasera.", p:"~25", u:"DKK", h:"lun–ven 7:30–17", badge:"ok", map:"Sankt Peders Bageri Sankt Peders Stræde 29"},
   {n:"Torvehallerne", w:"Pranzo. Smørrebrød da 68, tacos da 56, formaggi, caffè. Compra e mangia fuori.", p:"70–150", u:"DKK", h:"lun–ven 10–19", badge:"ok", map:"Torvehallerne København"},
   {n:"DØP · Den Økologiske Pølsemand", w:"Il carretto dell’hot dog biologico, <b>sotto la Rundetårn</b> su Købmagergade: oggi ci passi davanti alle 14:10 andando alla chiesa. Se il pranzo è stato leggero, cinque euro qui e sei a posto. <b>Chiude alle 18.</b>", p:"34–39", u:"DKK", h:"lun–ven 11:00–18:00", badge:"ok", map:"DØP Købmagergade 52"},
   {n:"Jægersborggade", w:"Cena a pezzi: Coffee Collective, Istid, botteghe. Nørrebro, la sera.", p:"varie", u:"", h:"sera", badge:"warn", map:"Jægersborggade"},
   {n:"Poulette", w:"Møllegade 1, a due passi da Jægersborggade. Panino di pollo fritto piccante, solo asporto: si mangia al parco. <b>Chiude alle 20.</b>", p:"~95", u:"DKK", h:"fino alle 20", badge:"warn", map:"Poulette Møllegade 1 København"}
  ]
 }

{
 id:"gio", iso:"2026-08-27", label:"Gio 27", sub:"Costa nord",
 title:"Costa nord: Kronborg, Louisiana, e tua sorella",
 lede:"Due tappe sole e il treno che fa il resto: esci di casa alle 10:40, non alle 9:40. Alle 17:15 torni a casa a lavarti e a fare la spesa — l’aeroporto è a <b>una fermata</b>, non serve andarci prima. Lei atterra alle <b>20:55</b>, e poi in centro: è la sua unica sera libera.",
 sun:"20:19",
 stops:[
  {t:"10:15", h:"Colazione a casa, senza fretta",
   b:"Oggi la giornata è costruita al contrario: <b>due tappe sole</b>, e il treno che riempie il resto. Non c’è niente che apra o chiuda per cui devi correre — Kronborg resta aperto fino alle <b>18</b> e Louisiana fino alle <b>22</b>.",
   b2:"Il pranzo di oggi è il sacco da casa, quindi <b>preparalo stasera</b>, non domattina di corsa: due panini di rugbrød, frutta, una bottiglia d’acqua. Se stasera vedi che il pane è finito, il Netto di Kastruplundgade è aperto — ma vacci <b>oggi</b>: domattina sarebbero 32 minuti a piedi e ti mangerebbero la partenza.",
   warn:"Riempi la bottiglia al rubinetto prima di uscire. L’acqua del Nord è buona e in giro una bottiglietta costa 25–30 corone.",
   badge:["ok","nessun orario da rincorrere"]},
  {t:"10:40", h:"Macchinetta a Kastrup → City Pass Large 24 ore", key:1,
   b:"Oggi esci dalle zone 1–4: Helsingør e Humlebæk richiedono il Large. Cerca «City Pass», poi <b>Large</b>, poi <b>24 hours</b>, Adult × 1.",
   b2:"Avrai due biglietti attivi insieme: se sale un controllore mostri il <b>Large</b>, che copre tutto.",
   price:"200 DKK", badge:["ok","zone 1–99"]},
  {t:"10:50", h:"A Nørreport", hop:"<b>M2</b> dir. <b>Vanløse</b> → <b>Nørreport</b>.",
   b:"Da Kastrup sono una quindicina di minuti e la M2 passa di continuo: non c’è una corsa da prendere."},
  {t:"11:15", h:"Kystbanen verso nord", key:1,
   hop:"<b>Nørreport</b> → treno regionale dir. <b>Helsingør</b> → <b>Helsingør</b>. <b>52 minuti, diretto, zero cambi.</b>",
   b:"Parte circa <b>ogni 20 minuti</b>: sul tabellone di Nørreport cerchi <b>Helsingør</b> e sali sul primo che c’è. <b>Non devi prendere un treno preciso</b> — se lo perdi, il prossimo è venti minuti dopo e non salta niente.",
   b2:"Nessun bus sostitutivo previsto: i lavori Snekkersten–Helsingør erano le sere del 25 e 26. <b>Dai comunque un’occhiata a Rejseplanen prima di uscire</b>: è l’unica voce della giornata che nessuno può garantirti in anticipo.",
   badge:["warn","orario da leggere sul tabellone"]},
  {t:"12:15", h:"Il sacco, sul porto di Helsingør",
   b:"Arrivi verso le 12:07 e mangi <b>prima</b> del castello, non dopo: così a Kronborg ci entri sazio e senza guardare l’ora. Esci dalla stazione, gira verso l’acqua e siediti sul molo: panchine, la Svezia a quattro chilometri davanti, e il castello che si vede in fondo.",
   b2:"<b>Non devi comprare niente e non devi parlare con nessuno.</b> È il pranzo che costa meno e funziona meglio di tutta la giornata: nessuna coda, nessun menù da decifrare, e ti siedi dove vuoi tu.",
   price:"già pagato lunedì", badge:["ok","niente da comprare"]},
  {t:"13:00", h:"Kronborg", v:8, key:1,
   hop:"<b>Porto di Helsingør</b> → <b>15 minuti a piedi</b> lungo l’acqua, tutto piano. Nessun mezzo da prendere.",
   b:"Il castello di Amleto sullo stretto, patrimonio UNESCO: le casematte sotterranee con Holger Danske che dorme, gli appartamenti reali, il cortile rinascimentale. <b>Agosto: tutti i giorni 10:00–18:00.</b>",
   b2:"<b>Compra online:</b> 135 invece di 150, e salti la cassa. Il biglietto vale un anno, quindi puoi comprarlo adesso da casa senza rischi.",
   warn:"Non devi vederlo tutto. Casematte, cortile e bastioni sono il castello; il resto è in più. Hai due ore e chiude alle 18: se ti siedi mezz’ora sui bastioni, va benissimo così. Se ti avanza mezzo panino, i bastioni sono il posto migliore dove finirlo.",
   price:"150 DKK · 135 online", badge:["ok","prezzo e orari verificati"], src:"https://kronborg.dk/en/tickets/day-ticket", map:"Kronborg Slot Helsingør"},
  {t:"15:15", h:"A Humlebæk",
   hop:"<b>Kronborg</b> → <b>15 minuti a piedi</b> fino alla stazione → treno regionale dir. sud → <b>Humlebæk</b>. 11 min. Poi <b>10 minuti a piedi</b> fino al museo.",
   b:"Anche qui parte di continuo: se resti a Kronborg mezz’ora in più arrivi a Louisiana alle 16:15 invece che alle 15:45. <b>Oggi però Louisiana è una tappa breve</b> — riparti alle 17:15 per andare a casa — quindi ogni mezz’ora in più a Kronborg è mezz’ora in meno lì."},
  {t:"15:45", h:"Louisiana", v:10, key:1,
   b:"Il museo più bello di Scandinavia: un percorso di padiglioni bassi che scendono nel parco sopra l’Øresund, con le sculture di Calder e Moore sul prato e la Svezia sull’orizzonte. Non è un museo che si visita, è un museo in cui si sta.",
   b2:"<b>Giovedì è aperto fino alle 22:00</b> — hai molto più margine di quanto pensi. <b>Non serve prenotare</b>: si compra all’ingresso.",
   warn:"<b>Un’ora e mezza, non di più.</b> Il museo chiude alle 22, ma stasera non lo sfrutti: alle 17:15 vai a casa a lavarti e a fare la spesa prima che arrivi tua sorella. Fai il prato delle sculture e una panchina davanti allo stretto, e lascia stare il resto. Se ti trovi bene e vuoi restare, il punto di rottura è le <b>18:30</b>: dopo, o salti la spesa o vai in aeroporto senza doccia.",
   price:"145 DKK · studenti 130", badge:["ok","mar–ven 10–22, lun chiuso"], src:"https://louisiana.dk/en/plan-your-visit/opening-hours/", map:"Louisiana Museum of Modern Art Humlebæk"},
  {t:"17:15", h:"Verso casa, non verso l’aeroporto", key:1,
   hop:"<b>Louisiana</b> → <b>10 min a piedi</b> → <b>Humlebæk</b> → treno regionale dir. sud → <b>Nørreport</b>. ~40 min.",
   b:"Oggi <b>non</b> scendi a København H: da <b>Nørreport</b> passa la M2, che ti porta a casa diretta. Sul tabellone cerchi <b>København H</b> o <b>Nørreport</b> nell’elenco delle fermate e sali sul primo treno che c’è: parte ogni venti minuti circa.",
   b2:"Non stai tagliando la serata: da Kastrup all’aeroporto è <b>una fermata di metro</b>. Puoi startene a casa fino alle 20:45 e arrivare comunque agli arrivi in anticipo.",
   badge:["ok","coperto dal City Pass Large"]},
  {t:"18:15", h:"A Kastrup",
   hop:"<b>Nørreport</b> → <b>M2</b> dir. <b>Lufthavnen</b> → <b>KASTRUP</b>. ~20 min.",
   warn:"A Nørreport M1 e M2 partono dallo stesso binario. Guarda il <b>numero sul muso del treno</b>: ti serve <b>M2</b>, quella per Lufthavnen. La M1 va a Vestamager e non passa da Kastrup."},
  {t:"18:40", h:"La spesa, prima di salire a casa", key:1,
   hop:"<b>Kastrup St</b> → <b>1,2 km · 16 min a piedi</b> → <b>Netto e 365discount, Kastruplundgade</b>. Tutto piano.",
   b:"Falla <b>adesso</b>, non dopo la doccia: sennò quei 16 minuti li cammini due volte, una volta pulito e una volta con le borse. Domani sera al Tivoli non ci passi, e sabato si parte: questa è la spesa che vi porta fino alla fine.",
   b2:"Siete in due da stasera: colazione per due, qualcosa per la cena di stasera e per quella di domani. In cassa non devi parlare — vedi la scheda <b>Cibo</b>, blocco «la spesa senza dover parlare».",
   warn:"Gli orari dei due negozi non sono confermabili da qui. I Netto chiudono di solito alle 22, ma <b>controlla su Maps mentre sei sul treno</b>, non dopo aver camminato un quarto d’ora.",
   badge:["warn","orari da controllare su Maps"], map:"Netto Kastruplundgade"},
  {t:"19:35", h:"Casa: borse a posto, sciacquata, cambio",
   b:"Un’ora abbondante per te. È l’unica pausa vera della settimana e capita nel punto giusto: dopo cinque giorni di cammino e prima di tre giorni in due.",
   b2:"<b>Lascia la cena pronta sul tavolo prima di uscire.</b> Quando rientrate verso le 22 lei mangia in venti minuti e uscite subito, invece di mettervi a cucinare in due a stomaco vuoto.",
   badge:["ok","due ore e tre quarti a casa"]},
  {t:"20:30", h:"Controlla il volo di tua sorella", key:1,
   b:"Il volo è dato in arrivo alle <b>20:55</b>. Guardalo <b>adesso</b>, da casa, sul sito dell’aeroporto o sull’app della compagnia. Se ha ritardo di un’ora, esci un’ora dopo: sei a quattro minuti dal gate degli arrivi e non c’è nessun motivo di aspettare lì.",
   badge:["ok","margine reale verificato"]},
  {t:"20:45", h:"All’aeroporto: una fermata", key:1,
   hop:"<b>KASTRUP</b> → <b>M2</b> dir. <b>Lufthavnen</b> → <b>Københavns Lufthavn</b>. <b>Una fermata, 4 minuti.</b>",
   b:"È il capolinea: non puoi sbagliare e non puoi passarlo. Coperto dal City Pass Large, che scade domattina alle 10:40."},
  {t:"21:00", h:"La aspetti agli arrivi",
   b:"Zona arrivi, Terminal 2 o 3 a seconda del volo. <b>Metti in conto 30–45 minuti fra l'atterraggio e il momento in cui esce davvero</b>: sbarco, nastro bagagli, uscita. <b>Atterraggio alle 20:55 vuol dire che lei è fuori fra le 21:25 e le 21:40.</b> Da qui in poi nessuna tappa ha una scadenza, quindi il ritardo non rompe niente."},
  {t:"21:40", h:"Il biglietto di tua sorella", key:1,
   b:"Alla macchinetta danese, subito: <b>City Pass Small 48 ore</b>. Attivato ora scade sabato verso le 20:00, cioè <b>dopo il vostro volo</b>. Le copre tutto: stasera in centro, il venerdì intero, Dragør e il rientro di sabato.",
   price:"~180–200 DKK", badge:["warn","prezzo da confermare alla macchinetta"]},
  {t:"21:55", h:"A casa, valigie giù, e si mangia qualcosa", key:1,
   hop:"<b>M2</b> dir. <b>Vanløse</b> → <b>prima fermata: KASTRUP</b>.",
   b:"Posate le valigie e mangiate la cena che hai lasciato pronta prima di uscire. <b>Non inseguite un ristorante stasera</b>: lei ha appena volato, e in venti minuti siete già fuori verso Nyhavn invece che ai fornelli.",

/* ---------------- rendering ---------------- */

function badge(b){ if(!b) return ""; const [k,txt]=b; return `<span class="b ${k}">${txt}</span>`; }

function stopHTML(s, isNow){
  const cls = ["stop", s.key?"key":"", isNow?"now":""].filter(Boolean).join(" ");
  let m = [];
  if(s.price) m.push(`<span class="pill money">${s.price}</span>`);
  if(s.badge) m.push(badge(s.badge));
  if(s.map) m.push(`<a class="maplink" href="${M(s.map)}" target="_blank" rel="noopener">↗ mappa</a>`);
  if(s.src) m.push(`<a class="src" href="${s.src}" target="_blank" rel="noopener">fonte</a>`);
  return `<article class="${cls}">
    <div class="t">${s.t}</div><div class="dot"></div>
    <div class="box">
      <h3>${s.h}${s.v?`<span class="v">${s.v}</span>`:""}</h3>
      ${s.b?`<p>${s.b}</p>`:""}
      ${s.b2?`<p>${s.b2}</p>`:""}
      ${s.hop?`<div class="hop">${s.hop}</div>`:""}
      ${s.warn?`<p class="warnline">⚠ ${s.warn}</p>`:""}
      ${m.length?`<div class="meta">${m.join("")}</div>`:""}
    </div></article>`;
}

function foodHTML(f){
  return `<div class="card foodblock">
    <p class="eyebrow">Dove mangi oggi</p>
    <p class="lede" style="margin-bottom:6px">${f.intro}</p>
    ${f.items.map(i=>`<div class="fitem">
      <div class="fmain">
        <h4>${i.n} ${i.badge!=="flat"?`<span class="b ${i.badge}">${i.h||"—"}</span>`:""}</h4>
        <p>${i.w}</p>
        ${i.map?`<p style="margin-top:5px"><a class="maplink" href="${M(i.map)}" target="_blank" rel="noopener">↗ mappa</a></p>`:""}
      </div>
      <div class="fprice">${i.p}<small>${i.u}</small></div>
    </div>`).join("")}
  </div>`;

function dayHTML(d, withNow){
  const today = new Date();
  const isToday = fmtISO(today) === d.iso;
  const nowMin = today.getHours()*60 + today.getMinutes();
  let nowIdx = -1;
  if(withNow && isToday){
    d.stops.forEach((s,i)=>{ const [H,Mi]=s.t.split(":").map(Number); if(H*60+Mi <= nowMin) nowIdx = i; });
  }
  return `<div class="dayhead">
      <p class="eyebrow">${d.label} · ${d.sub}</p>
      <h2>${d.title}</h2>
      <p class="lede" style="margin:8px 0 0">${d.lede}</p>
      <div class="daymeta">
        <span class="b flat">${d.stops.length} tappe</span>
        <span class="b flat">tramonto ${d.sun}</span>
      </div>
    </div>
    <div class="tl">${d.stops.map((s,i)=>stopHTML(s, i===nowIdx)).join("")}</div>
    ${foodHTML(d.food)}`;
}

function fmtISO(dt){
  return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");
}

    <h3 class="sec-h" style="font-size:1.08rem;margin-top:18px">I supermercati, e quanto distano davvero</h3>
    <p style="font-size:.9rem;color:var(--ink-2);margin:10px 0 0">
      Misurato su Maps il 23 agosto, a piedi dalla fermata <b>Kastrup</b>. Tutto pianeggiante.</p>
    <div class="tw" style="margin:10px 0 0"><table>
      <thead><tr><th>Dove</th><th>A piedi</th><th>Orario</th></tr></thead>
      <tbody>
        <tr><td><b>Netto</b> e <b>365discount</b><br>Kastruplundgade, uno di fronte all’altro</td><td class="num"><b>1,2 km<br>16 min</b></td><td>fino alle 22</td></tr>
        <tr><td><b>Minlaf</b> — frutta e verdura<br>su Amager Landevej</td><td class="num">~1,5 km</td><td>fino alle 20</td></tr>
        <tr><td><b>Lidl</b><br>su Amager Landevej</td><td class="num">2,1 km<br>29 min</td><td>fino alle 21:30</td></tr>
        <tr><td><s>Rema 1000, Præstefælledvej</s></td><td class="num"><b>4,7 km<br>1 ora</b></td><td>lascia perdere</td></tr>
      </tbody>
    </table></div>
    <div class="call note" style="margin:14px 0 0"><h4>Il giorno dell’arrivo, però, no</h4>
      <p>Con la valigia dietro 1,2 km all’andata e 1,2 al ritorno prima del check-in non hanno senso.
      <b>Lunedì il pranzo lo compri in aeroporto</b> e lo mangi sul pontile del Søbad. La spesa vera
      la fai dopo le 15, senza valigia.</p>
    </div>

    <h3 class="sec-h" style="font-size:1.08rem;margin-top:18px">Dove mangiartelo, che è il punto</h3>
    <p style="font-size:.9rem;color:var(--ink-2);margin:10px 0 0">
      <b>Kastrup Søbad</b> — il pontile di legno, seduto sul bordo con i piedi verso il mare e la
      Svezia davanti. È il posto migliore di tutta la zona e non costa niente.
      <b>Kastrup Havn</b>, il porticciolo, e <b>Amager Strandpark</b>, la spiaggia lunga, sono le
      altre due. Tre sere su sei torni tardi: quella libera, cena comprata sotto casa e mangiata lì.</p>

    <div class="call do" style="margin:14px 0 0"><h4>Farsi consegnare il cibo in giro: lascia perdere</h4>
      <p><b>Wolt e Just Eat consegnano a un indirizzo, non «dove sei adesso».</b> Una panchina al
      parco non è un indirizzo, e il fattorino se non ti trova ti telefona — in inglese, con te che
      cammini.</p>
      <p>E i conti non tornano: su Wolt il <b>minimo d’ordine è 100 corone</b> solo per i ristoranti,
      più il costo di consegna, e l’abbonamento che lo azzera costa 59 corone al mese. Il banco più
      la panchina costa meno, e non devi rispondere a nessuno.</p>
    </div>
    <div class="meta"><span class="b warn">posti e prezzi da recensioni: controlla sul posto</span></div>
  </div>

  <div class="card" style="margin-bottom:14px">
    <p class="eyebrow">Al banco, senza dover parlare</p>
    <h3 class="sec-h" style="font-size:1.08rem">Si ordina indicando</h3>
    <p style="font-size:.9rem;color:var(--ink-2);margin:10px 0 0">
      Ti metti in fila, <b>indichi col dito</b> e dici il numero: <b>«One, please»</b>. Se ne vuoi due,
      mostri due dita. Indicare è normalissimo, lo fanno tutti, nessuno ti guarda male.</p>
    <p style="font-size:.9rem;color:var(--ink-2);margin:12px 0 0">
      Poi ti fanno una domanda che non capisci. Quasi sempre è <i>«var der andet?»</i> (altro?) oppure
      <i>«skal du have en pose?»</i> (vuoi un sacchetto?).</p>

    <div class="call do" style="margin:14px 0 0"><h4>La regola d’oro</h4>
      <p>A quasi tutto quello che ti chiedono al banco, la risposta giusta è <b>«no, thank you»</b>.
      Praticamente ogni domanda è l’offerta di qualcosa in più — così non sbagli mai.</p>
      <p>Le uniche due che <b>non</b> sono offerte: <b>«eat in or take away?»</b>, a cui rispondi
      <b>«take away»</b> (capiscono in Danimarca e in Svezia), e il pagamento, a cui non si risponde
      affatto: avvicini la carta e basta.</p>
    </div>

    <h3 class="sec-h" style="font-size:1.08rem;margin-top:18px">Il kebab: le tre domande</h3>
    <p style="font-size:.9rem;color:var(--ink-2);margin:10px 0 0">
      È l’unico banco dove ti fanno scegliere davvero. Ma sono sempre le stesse tre domande, in
      quest’ordine, e le risposte stanno in due parole.</p>
    <div class="tw" style="margin:10px 0 0"><table>
      <thead><tr><th>Ti chiedono</th><th>Vuol dire</th><th>Rispondi</th></tr></thead>
      <tbody>
        <tr><td><i>durum, pita eller box?</i></td><td>piadina arrotolata, tasca, o vaschetta con patate</td><td><b>«durum»</b> — è quello che si mangia camminando</td></tr>
        <tr><td><i>alt i?</i></td><td>«dentro tutto?» — insalata, pomodoro, cipolla, cavolo</td><td><b>«yes, everything»</b></td></tr>
        <tr><td><i>hvilken sovs?</i></td><td>quale salsa: <i>hvidløg</i> aglio · <i>stærk</i> piccante · <i>mild</i> dolce</td><td><b>«garlic, mild»</b></td></tr>
      </tbody>
    </table></div>
    <p style="font-size:.9rem;color:var(--ink-2);margin:12px 0 0">
      Se ti chiedono anche la carne: <i>kylling</i> è pollo, <i>oksekød</i> è manzo, <i>blandet</i> è
      misto. Vale lo stesso in ogni grill danese, non solo da Killer Kebab.</p>

    <h3 class="sec-h" style="font-size:1.08rem;margin-top:18px">Te lo chiedono? E cambia il prezzo?</h3>
    <div class="tw" style="margin:10px 0 0"><table>
      <thead><tr><th>Dove</th><th>Te lo chiedono</th><th>Cambia il prezzo</th></tr></thead>
      <tbody>
        <tr><td><b>Danimarca</b></td><td>solo dove ci sono i tavoli</td><td><b>No.</b> IVA 25% su tutto, mangiato lì o portato via</td></tr>
        <tr><td><b>Svezia</b> 🇸🇪</td><td><b>sì, sempre</b></td><td><b>Sì.</b> Da asporto <b>6%</b>, seduto <b>12%</b></td></tr>
      </tbody>
    </table></div>
    <p style="font-size:.9rem;color:var(--ink-2);margin:12px 0 0">
      <b>Martedì in Svezia, quindi, «ta med» ti fa pagare meno.</b> Dal 1° aprile 2026 il cibo da
      asporto conta come alimentare e paga il 6%, mentre sedersi è un servizio di ristorazione e paga
      il 12%. Su un pranzo da 130 corone al Saluhall sono ~7 corone: poco, ma adesso te lo chiederanno
      di sicuro, perché sono obbligati a battere due aliquote diverse. E il piano ti manda comunque
      fuori a mangiare.</p>

    <h3 class="sec-h" style="font-size:1.08rem;margin-top:18px">Chi ha i tavoli, nel tuo piano</h3>

  <div class="card" style="margin-bottom:14px">
    <p class="eyebrow">Il carrello del lunedì</p>
    <h3 class="sec-h" style="font-size:1.08rem">Cosa comprare, con il nome che c’è sullo scaffale</h3>
    <p style="font-size:.9rem;color:var(--ink-2);margin:10px 0 0">
      La colonna in corsivo è <b>il nome danese</b>: cerca quello sulla confezione e non devi chiedere
      niente a nessuno. I prezzi sono indicativi da discount — <b>Netto, Lidl, Rema 1000</b> — e vanno
      guardati sullo scaffale.</p>

    <h4 style="font-size:.82rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);margin:16px 0 0">Colazione</h4>
    <div class="tw" style="margin:8px 0 0"><table>
      <thead><tr><th>Cosa</th><th>Sullo scaffale</th><th>DKK</th><th>A che serve</th></tr></thead>
      <tbody>
        <tr><td><b>Pane di segale scuro</b></td><td><i>rugbrød</i></td><td class="num">15–25</td><td>La base di tutto: colazione, pranzo al sacco, cena</td></tr>
        <tr><td><b>Burro salato</b></td><td><i>smør, saltet</i></td><td class="num">20–30</td><td>Sul rugbrød ci va sempre, e salato è la versione giusta</td></tr>
        <tr><td><b>Skyr o yogurt bianco</b></td><td><i>skyr</i></td><td class="num">12–20</td><td>Sazia molto e costa poco. Con la frutta è colazione fatta</td></tr>
        <tr><td><b>Fiocchi d’avena</b></td><td><i>havregryn</i></td><td class="num">10–15</td><td>Il pacco costa niente e dura tutta la settimana</td></tr>
        <tr><td><b>Caffè</b></td><td><i>kaffe</i></td><td class="num">30–50</td><td>Al bar è 35–45 a tazza: farlo a casa si ripaga il primo giorno</td></tr>

    <div class="call note" style="margin:16px 0 0"><h4>Il banco del pane sfuso, e come si paga</h4>
      <p>Quello vicino all’ingresso, coi cestoni e le pinze: è il <b>bake-off</b>, pane surgelato
      cotto lì la mattina. Ti servi da solo — <b>pinza, sacchetto di carta</b>, e via — e si paga
      <b>a pezzo</b>: il prezzo è sul cestone, non sul pane.</p>
      <p>Alla cassa è l’unico momento in cui ti possono chiedere qualcosa, perché il sacchetto non ha
      il codice a barre: il cassiere guarda dentro e batte lui. Se ti chiede cos’è, <b>apri il
      sacchetto e glielo fai vedere</b>. Alla cassa automatica c’è il tasto <i>brød</i> con le figure.</p>
      <p><b>I nomi:</b> <i>rundstykke</i> è il panino da colazione, <i>grovbolle</i> quello scuro,
      <i>birkes</i> quello coi semi di papavero, <i>kanelsnegl</i> la lumaca alla cannella,
      <i>wienerbrød</i> la pasta sfoglia dolce. Sui 4–8 corone il pane, 10–18 i dolci.</p>
      <p><b>Si mangia in giornata:</b> non ha conservanti e la sera è già duro. Per il madpakke non è
      questo il pane giusto — si sbriciola nello zaino: quello è il <i>rugbrød</i> in busta.</p></div>

    <h4 style="font-size:.82rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);margin:18px 0 0">Il companatico — in danese <i>pålæg</i>, ed è una parola che ti serve</h4>

        <tr><td><b>Sgombro al pomodoro</b></td><td><i>makrel i tomat</i></td><td class="num">12–18</td><td>In scatola. Proteine a due euro, ed è un classico vero</td></tr>
        <tr><td><b>Tonno in scatola</b></td><td><i>tun i vand · tun i olie</i></td><td class="num">12–20</td><td>C’è, sta accanto allo sgombro. <i>Tunsalat</i> in vaschetta è già mescolato con la maionese</td></tr>
        <tr><td><b>Formaggio a fette</b></td><td><i>ost · danbo, havarti</i></td><td class="num">25–40</td><td>Il pranzo più veloce da montare</td></tr>

        <tr><td><b>Salsa danese</b></td><td><i>remoulade</i></td><td class="num">15–20</td><td>Va su tutto e trasforma due fette di pane in un pranzo</td></tr>
      </tbody>
    </table></div>

    <h4 style="font-size:.82rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);margin:18px 0 0">Da mettere sopra, e da portarsi dietro</h4>
    <div class="tw" style="margin:8px 0 0"><table>
      <thead><tr><th>Cosa</th><th>Sullo scaffale</th><th>DKK</th><th>A che serve</th></tr></thead>
      <tbody>
        <tr><td><b>Cetriolo</b></td><td><i>agurk</i></td><td class="num">8–12</td><td>Sul leverpostej ci va sempre. Dura tutta la settimana</td></tr>
        <tr><td><b>Pomodori · cipolla rossa</b></td><td><i>tomater · rødløg</i></td><td class="num">15–25</td><td>Sullo sgombro la cipolla rossa è d’obbligo</td></tr>
        <tr><td><b>Banane e mele</b></td><td><i>bananer · æbler</i></td><td class="num">15–25 al kg</td><td>Lo spuntino che sta in tasca e non si schiaccia</td></tr>
        <tr><td><b>Gallette di segale</b></td><td><i>knækbrød · rugkiks</i></td><td class="num">12–20</td><td>Non si sbriciolano nello zaino come il pane</td></tr>
        <tr><td><b>Frutta secca</b></td><td><i>nødder</i></td><td class="num">25–40</td><td>Il sacchetto regge tre giorni di camminate</td></tr>
        <tr><td><b>Latticello dolce freddo</b></td><td><i>koldskål + kammerjunker</i></td><td class="num">~25</td><td>Quello che i danesi mangiano davvero ad agosto</td></tr>
        <tr><td><b>Carta forno o scatolina</b></td><td><i>bagepapir · madkasse</i></td><td class="num">15–30</td><td>Serve a incartare il madpakke: senza, in fondo allo zaino diventa poltiglia</td></tr>
      </tbody>
    </table></div>

    <div class="call do" style="margin:18px 0 0"><h4>Il pranzo al sacco danese si chiama <i>madpakke</i>, e si fa così</h4>
      <p>Due fette di <b>rugbrød</b>, burro salato su tutt’e due, e sopra <b>una cosa sola</b> — non
      si impila. Le tre combinazioni che funzionano:</p>
      <p><b>1 ·</b> leverpostej + fette di cetriolo &nbsp;·&nbsp; <b>2 ·</b> makrel i tomat + cipolla
      rossa &nbsp;·&nbsp; <b>3 ·</b> formaggio + remoulade</p>
      <p><b>Con la maionese, no.</b> <i>Tunsalat</i>, <i>hønsesalat</i> e le altre insalate in
      vaschetta sono ottime a casa la sera, ma in uno zaino chiuso per sei ore ad agosto non le
      porterei: per il sacco meglio il tonno sgocciolato dalla scatoletta, il leverpostej o il
      formaggio.</p>
      <p>Si avvolge nella carta forno e sta in piedi nello zaino. <b>Non è un panino:</b> il pane
      resta aperto e si mangia con le mani, oppure lo chiudi per portarlo.</p>
      <p><b>Quanto ti fa risparmiare:</b> un madpakke fatto da te sta sui <b>15–20 corone</b>. Un
      pranzo a Torvehallerne è 70–150. Su tre giorni sono <b>200–400 corone</b>, cioè 27–54 euro —
      un museo e una cena.</p>
    </div>

    <div class="call note" style="margin:14px 0 0"><h4>Le cinque cose che tagliano il conto</h4>
      <p><b>1 ·</b> <b>Netto, Lidl e Rema 1000</b> sono i discount. Føtex costa di più, Irma molto di più.</p>
      <p><b>2 ·</b> Cerca i cartellini gialli: <b><i>tilbud</i></b> vuol dire offerta. È l’unica parola danese che ti serve al supermercato.</p>
      <p><b>3 ·</b> Le marche del supermercato costano molto meno delle marche note, e per rugbrød, burro e skyr non cambia niente.</p>
      <p><b>4 ·</b> <b>Too Good To Go</b> per le colazioni: i forni svendono il sacco a fine giornata a un terzo del prezzo.</p>
      <p><b>5 ·</b> L’acqua dal rubinetto, e il <b>pant</b> delle bottiglie riportato indietro.</p>
    </div>

    <p class="eyebrow">La spesa senza dover parlare</p>
    <h3 class="sec-h" style="font-size:1.08rem">Casse automatiche: dove sì e dove no</h3>
    <div class="tw" style="margin:10px 0 0"><table>
      <thead><tr><th>Catena</th><th>Casse automatiche</th><th>Nota</th></tr></thead>
      <tbody>
        <tr><td><b>Lidl</b></td><td><b>quasi ovunque</b></td><td>Le stanno mettendo in tutti i negozi: <b>tre clienti su quattro</b> le usano. È la scelta più sicura</td></tr>
        <tr><td><b>Føtex</b></td><td><b>sì</b></td><td>609 automatiche contro ~1.000 con cassiere</td></tr>
        <tr><td><b>Bilka</b></td><td><b>tutti</b></td><td>Ipermercati, fuori dal centro</td></tr>
        <tr><td><b>Netto</b></td><td><b>circa 4 su 10</b></td><td>239 negozi su 549. Testa o croce: guarda entrando</td></tr>
        <tr><td><b>Rema 1000</b></td><td>solo via app</td><td>Il loro «Scan Selv» richiede di registrarsi in un’app danese. <b>Lascia perdere</b></td></tr>
      </tbody>
    </table></div>
    <p style="font-size:.9rem;color:var(--ink-2);margin:12px 0 0">
      <b>E se trovi solo casse con cassiere, non cambia niente.</b> Metti la roba sul nastro, lui passa
      i prodotti, il totale compare sul display, tu avvicini la carta. Non si parla. Al massimo ti dice
      <b>«hej»</b> all’inizio e <b>«tak»</b> alla fine, e tu rispondi uguale.</p>
    <div class="meta"><span class="b ok">dati Salling Group e Lidl Danmark</span></div>
  </div>

  <div class="stack" style="margin-bottom:14px">
    <div class="call note"><h4>Quattro cose che ti colgono di sorpresa</h4>
      <p><b>Nel reparto frutta e verdura non c’è la bilancia</b>, e non te la sei persa: qui non si
      pesa e non si stampa nessuna etichetta. Quasi tutto è già in busta col prezzo sopra. Quello
      sfuso si paga <b>a pezzo</b> — sul cartellino c’è <i>stk</i>, cioè «l’uno», ed è il prezzo di
      quello che tieni in mano — oppure <b>lo pesa la cassa</b>, se il cartellino dice <i>kr/kg</i>:
      lo metti sul nastro e ci pensa il cassiere. Alla cassa automatica la bilancia è dentro il
      banco: appoggi la roba e la cerchi sullo schermo con la figura.</p>
      <p><b>Il sacchetto si paga</b> e te lo chiedono: <i>«pose?»</i>. Portati una borsa da casa e la
      domanda non arriva nemmeno.</p>
      <p><b>Bottiglie e lattine hanno la cauzione</b> (<i>pant</i>, 1–3 corone a pezzo, ed è già nel
      prezzo). La riprendi infilandole nella macchina all’ingresso del supermercato: esce uno
      scontrino con un codice a barre, che scansioni alla cassa automatica o consegni al cassiere.
      Su sei giorni di bottiglie d’acqua sono diverse decine di corone.</p>
      <p><b>Alla cassa automatica l’alcol blocca tutto:</b> serve un commesso che sblocchi. Non hai
      sbagliato niente, è la verifica dell’età. Aspetta e basta — oppure la birra prendila alla cassa
      normale.</p></div>
  </div>

  <div class="card" style="margin-bottom:14px">
    <p class="eyebrow">Da provare, non un posto ma un piatto</p>
    <p style="font-size:.92rem;color:var(--ink-2);margin:6px 0 0">
    <b>Koldskål</b> coi biscottini <i>kammerjunker</i>, dal supermercato, ~25 DKK: latticello dolce freddo, quello che i danesi mangiano davvero in agosto.
    Poi <b>tebirkes</b> (sfoglia ai semi di papavero col marzapane — la vera colazione danese, non il croissant),
    <b>flæskestegssandwich</b>, <b>hindbærsnitte</b>, <b>frikadeller</b>, e il <b>rugbrød</b> con burro salato e aringa marinata, che ti fai da solo.</p>

/* I dati di casa vivono solo in localStorage, su questo dispositivo. */
const CASA_KEY = "oresund.casa";
function leggiCasa(){
  try { return JSON.parse(localStorage.getItem(CASA_KEY)) || {}; } catch(e){ return {}; }
}
function mostraCasa(){
  const c = leggiCasa();
  const view = document.getElementById("addrView");
  if(c.addr && c.addr.trim()){
    view.textContent = c.addr.trim();
    view.classList.remove("empty");
  } else {
    view.textContent = "Tocca «modifica» e scrivi qui l’indirizzo";
    view.classList.add("empty");
  }
  const row = document.getElementById("hostRow");
  if(c.tel || c.host){
    row.hidden = false;
    document.getElementById("hostName").textContent = c.host ? ("Host · " + c.host) : "Host";
    document.getElementById("hostTel").textContent = c.tel || "—";
  } else { row.hidden = true; }
  const note = document.getElementById("hostNote");
  if(c.note && c.note.trim()){ note.hidden = false; note.textContent = c.note.trim(); }
  else { note.hidden = true; }
}
function wireCasa(){
  const c = leggiCasa();
  const F = id => document.getElementById(id);
  F("fAddr").value = c.addr || ""; F("fHost").value = c.host || "";
  F("fTel").value  = c.tel  || ""; F("fNote").value = c.note || "";
  F("editBtn").addEventListener("click", () => {
    const box = F("fields");
    box.hidden = !box.hidden;
    F("editBtn").textContent = box.hidden ? "modifica" : "chiudi";
    if(!box.hidden) F("fAddr").focus();
  });
  F("saveBtn").addEventListener("click", () => {
    const dati = { addr:F("fAddr").value, host:F("fHost").value, tel:F("fTel").value, note:F("fNote").value };
    try { localStorage.setItem(CASA_KEY, JSON.stringify(dati)); } catch(e){}
    F("fields").hidden = true; F("editBtn").textContent = "modifica";
    mostraCasa();
  });
  mostraCasa();
}

/* Service worker: rende l'app utilizzabile senza rete una volta installata,
   e avvisa quando esce una versione nuova — senza mai aggiornarsi di nascosto.
   Su claude.ai fallisce senza far danni: lì è solo un'anteprima. */
if ("serviceWorker" in navigator && location.protocol === "https:") {
  window.addEventListener("load", async () => {
    let reg;
    try { reg = await navigator.serviceWorker.register("sw.js"); } catch(e){ return; }

    const barra = document.getElementById("updbar");
    const proponi = worker => {
      if(!worker) return;
      barra.classList.add("on");
      document.getElementById("updbtn").onclick = () => {
        document.getElementById("updbtn").textContent = "aggiorno…";
        worker.postMessage({ type: "AGGIORNA" });
      };
    };

    // Versione nuova già in attesa da una visita precedente
    if (reg.waiting && navigator.serviceWorker.controller) proponi(reg.waiting);

    // Versione nuova trovata adesso
    reg.addEventListener("updatefound", () => {
      const nuovo = reg.installing;
      if(!nuovo) return;
      nuovo.addEventListener("statechange", () => {
        if (nuovo.state === "installed" && navigator.serviceWorker.controller) proponi(nuovo);
      });
    });

    // Quando il nuovo worker prende il controllo, ricarico una volta sola
    let ricaricato = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (ricaricato) return; ricaricato = true; location.reload();
    });

    // Controlla se c'è una versione nuova a ogni apertura e ogni 15 minuti
    const controlla = () => reg.update().catch(() => {});
    controlla();
    setInterval(controlla, 15 * 60 * 1000);
    document.addEventListener("visibilitychange", () => { if(!document.hidden) controlla(); });
  });
}
